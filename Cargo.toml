[package]
name = "crc-gen"
version = "0.1.0"
edition = "2021"
publish = false
description = "Generate and simplify symbolic, table-free CRC update equations"
repository = "https://github.com/codyps/crc-gen"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
