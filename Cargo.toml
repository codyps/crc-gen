[package]
name = "crc-gen"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "Generate and simplify symbolic, table-free CRC update equations"
repository = "https://github.com/codyps/crc-gen"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
flate2 = "1.1"
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
